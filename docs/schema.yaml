version: 1
database: PostgreSQL
source_of_truth: backend/migrations
note: >
  Документ описывает модель данных. DDL создаётся только SQL-миграциями,
  чтобы не было двух расходящихся источников схемы.

tables:
  users:
    owner: auth
    note: >
      Таблица и доменная модель принадлежат модулю User/Auth. Модули training
      и progress используют только users.id и не изменяют эту сущность.

  scenarios:
    columns:
      id: { type: uuid, primary_key: true }
      slug: { type: varchar(100), not_null: true, unique: true }
      title: { type: varchar(200), not_null: true }
      role: { type: scenario_role, not_null: true }
      risk_module: { type: varchar(100), not_null: true }
      current_version_id: { type: uuid, nullable: true, references: scenario_versions.id }
      created_at: { type: timestamptz, not_null: true }
    note: >
      Сценарий — стабильный логический объект. Публикация новой версии меняет
      только current_version_id; предыдущие scenario_versions не изменяются.

  scenario_versions:
    columns:
      id: { type: uuid, primary_key: true }
      scenario_id: { type: uuid, not_null: true, references: scenarios.id }
      version: { type: integer, not_null: true, minimum: 1 }
      start_node_id: { type: uuid, nullable: true }
      max_score_points: { type: integer, not_null: true, minimum: 1 }
      # TODO(owner: scenario): добавить колонку в production-миграцию Scenario-модуля.
      pass_percent: { type: smallint, not_null: true, minimum: 1, maximum: 100 }
      published_at: { type: timestamptz, not_null: true }
    constraints:
      - unique: [scenario_id, version]
      - published scenario_versions are immutable

  scenario_nodes:
    columns:
      id: { type: uuid, primary_key: true }
      scenario_version_id:
        { type: uuid, not_null: true, references: scenario_versions.id }
      node_key: { type: varchar(100), not_null: true }
      node_type: { type: scenario_node_type, not_null: true }
      content: { type: jsonb, not_null: true }
      sort_order: { type: integer, not_null: true }
    constraints:
      - unique: [scenario_version_id, node_key]

  scenario_transitions:
    columns:
      id: { type: uuid, primary_key: true }
      scenario_version_id:
        { type: uuid, not_null: true, references: scenario_versions.id }
      from_node_id: { type: uuid, not_null: true, references: scenario_nodes.id }
      to_node_id: { type: uuid, not_null: true, references: scenario_nodes.id }
      label: { type: text, not_null: true }
      score_delta: { type: integer, not_null: true, minimum: 0 }
      explanation: { type: text, not_null: true }

  risk_markers:
    columns:
      id: { type: uuid, primary_key: true }
      code: { type: varchar(100), not_null: true, unique: true }
      title: { type: varchar(200), not_null: true }
      description: { type: text, not_null: true }

  transition_risk_markers:
    columns:
      transition_id:
        { type: uuid, not_null: true, references: scenario_transitions.id }
      risk_marker_id:
        { type: uuid, not_null: true, references: risk_markers.id }
    primary_key: [transition_id, risk_marker_id]

  attempts:
    columns:
      id: { type: uuid, primary_key: true }
      user_id: { type: uuid, not_null: true, references: users.id }
      scenario_version_id:
        { type: uuid, not_null: true, references: scenario_versions.id }
      current_node_id: { type: uuid, not_null: true, references: scenario_nodes.id }
      status: { type: attempt_status, not_null: true }
      score_points: { type: integer, not_null: true, default: 0, minimum: 0 }
      max_score_points: { type: integer, not_null: true, minimum: 1 }
      revision: { type: integer, not_null: true, default: 0, minimum: 0 }
      started_at: { type: timestamptz, not_null: true }
      completed_at: { type: timestamptz, nullable: true }
    note: >
      max_score_points копируется из scenario_versions при старте попытки.
      Поэтому исторический результат остаётся интерпретируемым.

  attempt_steps:
    columns:
      id: { type: uuid, primary_key: true }
      attempt_id: { type: uuid, not_null: true, references: attempts.id }
      step_no: { type: integer, not_null: true, minimum: 1 }
      transition_id:
        { type: uuid, not_null: true, references: scenario_transitions.id }
      client_action_id: { type: uuid, not_null: true }
      score_delta: { type: integer, not_null: true, minimum: 0 }
      created_at: { type: timestamptz, not_null: true }
    constraints:
      - unique: [attempt_id, step_no]
      - unique: [attempt_id, client_action_id]

enums:
  scenario_role: [buyer, seller]
  scenario_node_type: [scene, decision, ending]
  attempt_status: [in_progress, completed]

business_invariants:
  - start_node_id должен принадлежать той же scenario_version.
  - Переход связывает узлы только одной scenario_version.
  - current_version_id сценария указывает на опубликованную версию этого же сценария.
  - Новая публикация создаёт новую неизменяемую scenario_version и меняет current_version_id.
  - Попытка всегда привязана к конкретной scenario_version и пользователю из User/Auth domain.
  - Новая попытка создаётся только для current_version_id.
  - Незавершённая попытка устаревшей версии может быть завершена, но не участвует в прогрессе текущей версии.
  - score_points равен сумме score_delta её attempt_steps; процент результата вычисляется как round(100 * score_points / max_score_points).
  - Успешность вычисляется без округления: score_points * 100 >= max_score_points * pass_percent.
  - Выполнение действия проверяет user_id, current_node_id и revision в одной транзакции.
  - Повтор client_action_id возвращает ранее сохранённый результат и не создаёт второй attempt_step.

indexes:
  - { table: scenarios, columns: [role, current_version_id] }
  - { table: attempts, columns: [user_id, scenario_version_id, status, completed_at] }
  - { table: attempts, columns: [user_id, started_at] }
  - { table: attempt_steps, columns: [attempt_id, step_no] }
  - { table: attempt_steps, columns: [attempt_id, client_action_id], unique: true }
