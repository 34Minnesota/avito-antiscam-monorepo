openapi: 3.1.0
info:
  title: Anti-Scam Trainer API
  version: 1.0.0
  description: API интерактивного тренажёра безопасных сделок.
servers:
  - url: /api
security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: healthCheck
      security: []
      responses:
        "200": { description: Сервис доступен }

  /v1/auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Успешная авторизация
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Неверный email или пароль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/scenarios:
    get:
      operationId: listScenarios
      responses:
        "200":
          description: Сценарии и прогресс в их текущих версиях
          content:
            application/json:
              schema:
                type: object
                required: [scenarios]
                properties:
                  scenarios:
                    type: array
                    items: { $ref: "#/components/schemas/ScenarioSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/scenarios/{slug}/attempts:
    post:
      operationId: createAttempt
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9-]+$" }
      responses:
        "200":
          description: Существующая незавершённая попытка текущей версии
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttemptState" }
        "201":
          description: Новая попытка текущей версии
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttemptState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/attempts/{attemptId}:
    get:
      operationId: getAttempt
      parameters: [ { $ref: "#/components/parameters/AttemptID" } ]
      responses:
        "200":
          description: Состояние принадлежащей пользователю попытки
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttemptState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/attempts/{attemptId}/actions:
    post:
      operationId: executeAction
      parameters: [ { $ref: "#/components/parameters/AttemptID" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transitionId, expectedRevision, clientActionId]
              properties:
                transitionId: { type: string, format: uuid }
                expectedRevision: { type: integer, minimum: 0 }
                clientActionId: { type: string, format: uuid }
      responses:
        "200":
          description: Действие применено либо возвращён результат его повтора
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Переход недоступен из текущего состояния попытки
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/progress:
    get:
      operationId: getProgress
      responses:
        "200":
          description: Прогресс в текущих версиях, история и устаревшие незавершённые попытки
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    AttemptID:
      name: attemptId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Некорректный запрос
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Отсутствует или недействителен Bearer JWT
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Ресурс не найден или не принадлежит текущему пользователю
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Устаревшая revision либо clientActionId использован с другими данными
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    InternalError:
      description: Внутренняя ошибка сервера
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    DependencyUnavailable:
      description: Внешний Auth, Scenario или storage-контракт временно недоступен
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Score:
      type: object
      required: [points, maxPoints, percent]
      properties:
        points: { type: integer, minimum: 0 }
        maxPoints: { type: integer, minimum: 1 }
        percent: { type: integer, minimum: 0, maximum: 100 }
    ScenarioVersion:
      type: object
      required: [number, passPercent, publishedAt]
      properties:
        number: { type: integer, minimum: 1 }
        passPercent: { type: integer, minimum: 1, maximum: 100 }
        publishedAt: { type: string, format: date-time }
    CurrentVersionProgress:
      type: object
      required: [completed, passed, attemptsCount, bestScore, activeAttemptId]
      properties:
        completed: { type: boolean }
        passed: { type: boolean }
        attemptsCount: { type: integer, minimum: 0 }
        bestScore: { oneOf: [ { $ref: "#/components/schemas/Score" }, { type: "null" } ] }
        activeAttemptId: { type: [string, "null"], format: uuid }
    ScenarioSummary:
      type: object
      required: [slug, title, role, riskModule, currentVersion, currentProgress]
      properties:
        slug: { type: string }
        title: { type: string }
        role: { type: string, enum: [buyer, seller] }
        riskModule: { type: string }
        currentVersion: { $ref: "#/components/schemas/ScenarioVersion" }
        currentProgress: { $ref: "#/components/schemas/CurrentVersionProgress" }
    AttemptState:
      type: object
      required: [attemptId, scenarioSlug, version, isOutdated, status, score, revision, screen]
      properties:
        attemptId: { type: string, format: uuid }
        scenarioSlug: { type: string }
        version: { $ref: "#/components/schemas/ScenarioVersion" }
        isOutdated: { type: boolean }
        status: { type: string, enum: [in_progress, completed] }
        score: { $ref: "#/components/schemas/Score" }
        revision: { type: integer, minimum: 0 }
        screen: { $ref: "#/components/schemas/Screen" }
    Screen:
      type: object
      required: [nodeKey, type, content]
      properties:
        nodeKey: { type: string }
        type: { type: string, enum: [scene, decision, ending] }
        content: { type: string }
        actions:
          type: array
          items: { $ref: "#/components/schemas/AvailableAction" }
    AvailableAction:
      type: object
      required: [transitionId, label]
      properties:
        transitionId: { type: string, format: uuid }
        label: { type: string }
    RiskMarker:
      type: object
      required: [code, title, description]
      properties:
        code: { type: string }
        title: { type: string }
        description: { type: string }
    ActionResult:
      type: object
      required: [attempt, feedback]
      properties:
        attempt: { $ref: "#/components/schemas/AttemptState" }
        feedback:
          type: object
          required: [scoreDelta, explanation, riskMarkers]
          properties:
            scoreDelta: { type: integer, minimum: 0 }
            explanation: { type: string }
            riskMarkers:
              type: array
              items: { $ref: "#/components/schemas/RiskMarker" }
    HistoricalVersionProgress:
      type: object
      required: [version, completed, passed, attemptsCount, bestScore]
      properties:
        version: { $ref: "#/components/schemas/ScenarioVersion" }
        completed: { type: boolean }
        passed: { type: boolean }
        attemptsCount: { type: integer, minimum: 0 }
        bestScore: { oneOf: [ { $ref: "#/components/schemas/Score" }, { type: "null" } ] }
    CompletedAttemptResult:
      type: object
      required: [attemptId, version, score, passed, completedAt]
      properties:
        attemptId: { type: string, format: uuid }
        version: { $ref: "#/components/schemas/ScenarioVersion" }
        score: { $ref: "#/components/schemas/Score" }
        passed: { type: boolean }
        completedAt: { type: string, format: date-time }
    ScenarioProgress:
      type: object
      required: [scenarioSlug, title, currentVersion, currentProgress, history, recentAttempts]
      properties:
        scenarioSlug: { type: string }
        title: { type: string }
        currentVersion: { $ref: "#/components/schemas/ScenarioVersion" }
        currentProgress: { $ref: "#/components/schemas/CurrentVersionProgress" }
        history:
          type: array
          description: Прошлые версии не влияют на currentProgress.
          items: { $ref: "#/components/schemas/HistoricalVersionProgress" }
        recentAttempts:
          type: array
          maxItems: 20
          description: Последние завершённые попытки по всем версиям, от новых к старым.
          items: { $ref: "#/components/schemas/CompletedAttemptResult" }
    RoleProgress:
      type: object
      required: [role, totalScenarios, completedScenarios, passedScenarios, completionPercent, passedPercent, scenarios]
      properties:
        role: { type: string, enum: [buyer, seller] }
        totalScenarios: { type: integer, minimum: 0 }
        completedScenarios: { type: integer, minimum: 0 }
        passedScenarios: { type: integer, minimum: 0 }
        completionPercent: { type: integer, minimum: 0, maximum: 100 }
        passedPercent: { type: integer, minimum: 0, maximum: 100 }
        scenarios:
          type: array
          items: { $ref: "#/components/schemas/ScenarioProgress" }
    OutdatedActiveAttempt:
      type: object
      required: [attemptId, scenarioSlug, scenarioTitle, version, currentVersion]
      properties:
        attemptId: { type: string, format: uuid }
        scenarioSlug: { type: string }
        scenarioTitle: { type: string }
        version: { $ref: "#/components/schemas/ScenarioVersion" }
        currentVersion: { $ref: "#/components/schemas/ScenarioVersion" }
    ProgressResponse:
      type: object
      required: [totalScenarios, completedScenarios, passedScenarios, completionPercent, passedPercent, roles, outdatedActiveAttempts]
      properties:
        totalScenarios: { type: integer, minimum: 0 }
        completedScenarios: { type: integer, minimum: 0 }
        passedScenarios: { type: integer, minimum: 0 }
        completionPercent: { type: integer, minimum: 0, maximum: 100 }
        passedPercent: { type: integer, minimum: 0, maximum: 100 }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleProgress" }
        outdatedActiveAttempts:
          type: array
          items: { $ref: "#/components/schemas/OutdatedActiveAttempt" }
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      required:
        - sessionId
      properties:
        sessionId:
          type: string
          format: uuid
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
