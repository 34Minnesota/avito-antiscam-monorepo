
services:
  postgres:
    image: postgres:16

    container_name: antiscam-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: antiscam
      POSTGRES_USER: antiscam
      POSTGRES_PASSWORD: antiscam

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antiscam"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: